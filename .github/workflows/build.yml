name: build
on:
  push:
    branches:
    - main
    tags:
    - '*'
  pull_request:
  workflow_dispatch:
    inputs:
      forcePublish:
        description: When true the Publish stage will always be run, otherwise it only runs for tagged versions.
        required: false
        default: false
        type: boolean
      forcePublicNugetDestination:
        description: When true the NuGet Publish destination will always be set to nuget.org. (Normally, force publishing publishes to the private feed on GitHub.)
        required: false
        default: false
        type: boolean

concurrency:
  group: ${{ github.workflow }}-${{ github.sha }}
  cancel-in-progress: true

permissions:
  actions: write  # enable cache clean-up
  checks: write  # enable test result annotations
  contents: write  # enable creating releases
  id-token: write  # enable NuGet.org Trusted Publishing (OIDC)
  issues: read
  packages: write  # enable publishing packages
  pull-requests: write  # enable test result annotations

# The whole build runs as a single job defined in this file, rather than through the shared multi-job
# reusable workflow. NuGet.org Trusted Publishing only accepts an OIDC token when its 'job_workflow_ref'
# claim points at a workflow file in this repository, and a job that lives in a reusable workflow in
# another repository reports that workflow instead. The actions used below are composite actions, which
# run inside this job, so the claim refers to this file.
jobs:
  build:
    name: Run Build
    runs-on: ubuntu-latest
    steps:
    # Declare any environment variables and/or secrets that need to be available inside the build process
    - uses: endjin/Endjin.RecommendedPractices.GitHubActions/actions/prepare-env-vars-and-secrets@main
      id: prepareEnvVarsAndSecrets
      with:
        environmentVariablesYaml: |
          ZF_NUGET_PUBLISH_SOURCE: ${{ (startsWith(github.ref, 'refs/tags/') || github.event.inputs.forcePublicNugetDestination == 'true') && 'https://api.nuget.org/v3/index.json' || format('https://nuget.pkg.github.com/{0}/index.json', github.repository_owner) }}
          # Trusted Publishing only applies to nuget.org - GitHub Packages publishing still uses NUGET_API_KEY
          ZF_BUILD_DOTNET_NUGET_USE_TRUSTED_PUBLISHING: ${{ (startsWith(github.ref, 'refs/tags/') || github.event.inputs.forcePublicNugetDestination == 'true') && vars.ZF_BUILD_DOTNET_NUGET_USE_TRUSTED_PUBLISHING || 'false' }}
          ZF_BUILD_DOTNET_NUGET_TRUSTED_PUBLISHING_USER: ${{ vars.ZF_BUILD_DOTNET_NUGET_TRUSTED_PUBLISHING_USER }}
        secretsYaml: |
          # nuget.org publishing uses Trusted Publishing (OIDC), so an API key is only needed for GitHub Packages
          NUGET_API_KEY: "${{ !(startsWith(github.ref, 'refs/tags/') || github.event.inputs.forcePublicNugetDestination == 'true') && secrets.BUILD_PUBLISHER_PAT || '' }}"
        secretsEncryptionKey: ${{ secrets.SHARED_WORKFLOW_KEY }}

    - uses: endjin/Endjin.RecommendedPractices.GitHubActions/actions/run-build-process@main
      id: run_build
      with:
        netSdkVersion: '10.x'
        # workflow_dispatch inputs are always strings, the type property is just for the UI
        forcePublish: ${{ github.event.inputs.forcePublish == 'true' }}
        buildEnv: ${{ steps.prepareEnvVarsAndSecrets.outputs.environmentVariablesYamlBase64 }}
        buildSecrets: ${{ steps.prepareEnvVarsAndSecrets.outputs.secretsYamlBase64 }}
        buildAzureCredentials: ${{ secrets.AZURE_READER_CREDENTIALS }}
        token: ${{ secrets.GITHUB_TOKEN }}
        secretsEncryptionKey: ${{ secrets.SHARED_WORKFLOW_KEY }}
